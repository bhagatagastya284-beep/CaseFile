services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: mongodb://mongo:27017/casefile
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret}
      JWT_EXPIRES_IN: 7d
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: '0.2'
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      FRONTEND_URL: http://localhost:5173
      UPLOAD_PATH: uploads
      MAX_UPLOAD_MB: '25'
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_logs:/app/backend/logs
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
  backend_logs:
